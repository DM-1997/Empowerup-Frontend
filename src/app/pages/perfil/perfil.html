<div class="container py-5">

  <!-- HEADER PERFIL -->
  <div class="card shadow-sm p-4 text-center">

    <img
      [src]="usuario.avatar"
      class="rounded-circle mx-auto mb-3"
      width="120"
      height="120"
      alt="Avatar"
    />

    <h2 class="fw-bold">{{ usuario.nome }}</h2>
    <p class="text-muted">{{ usuario.email }}</p>

  </div>

  <!-- STATS -->
  <div class="row text-center mt-4">

    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h3 class="text-primary">{{ usuario.campanhasCriadas }}</h3>
        <p class="mb-0">Campanhas Criadas</p>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h3 class="text-success">{{ usuario.campanhasApoiadas }}</h3>
        <p class="mb-0">Campanhas Apoiadas</p>
      </div>
    </div>

  </div>

  <!-- AÇÕES -->
  <div class="d-flex justify-content-center gap-3 mt-4">

    <button class="btn btn-primary" routerLink="/criar-campanha">
      Criar Nova Campanha
    </button>

    <button class="btn btn-outline-dark" routerLink="/minhas-campanhas">
      Ver Minhas Campanhas
    </button>

  </div>

</div>
