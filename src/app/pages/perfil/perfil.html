<div
  class="container py-5"
  *ngIf="usuario$ | async as usuario"
>

  <!-- HEADER PERFIL -->
  <div class="card shadow-sm p-4 text-center">

    <!-- FOTO -->
    <div class="position-relative d-inline-block mx-auto">

      <img
        [src]="usuario.avatar || 'https://i.pravatar.cc/150?img=12'"
        class="rounded-circle border border-3 border-primary"
        width="140"
        height="140"
        style="object-fit: cover;"
        alt="Avatar"
      />

      <!-- BOTÃO ALTERAR FOTO -->
      <label
        for="fotoPerfil"
        class="btn btn-primary btn-sm rounded-circle position-absolute"
        style="
          bottom:0;
          right:0;
          width:40px;
          height:40px;
          display:flex;
          align-items:center;
          justify-content:center;
          cursor:pointer;
        "
        title="Alterar foto"
      >
        📷
      </label>

      <input
        id="fotoPerfil"
        type="file"
        accept="image/*"
        hidden
        (change)="selecionarFoto($event)"
      />

    </div>

    <!-- NOME -->
    <h2 class="fw-bold mt-3">
      {{ usuario.nome }}
    </h2>

    <!-- EMAIL -->
    <p class="text-muted">
      {{ usuario.email }}
    </p>

  </div>

  <!-- STATS -->
  <div class="row text-center mt-4">

    <!-- CAMPANHAS CRIADAS -->
    <div class="col-md-6 mb-3">

      <div class="card p-3 shadow-sm">

        <h3 class="text-primary">
          {{ usuario.campanhasCriadas || 0 }}
        </h3>

        <p class="mb-0">
          Campanhas Criadas
        </p>

      </div>

    </div>

    <!-- CAMPANHAS APOIADAS -->
    <div class="col-md-6 mb-3">

      <div class="card p-3 shadow-sm">

        <h3 class="text-success">
          {{ usuario.campanhasApoiadas || 0 }}
        </h3>

        <p class="mb-0">
          Campanhas Apoiadas
        </p>

      </div>

    </div>

  </div>

  <!-- AÇÕES -->
  <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">

    <button
      class="btn btn-primary"
      routerLink="/criar-campanha">

      Criar Nova Campanha

    </button>

    <button
      class="btn btn-outline-dark"
      routerLink="/minhas-campanhas">

      Ver Minhas Campanhas

    </button>

  </div>

</div>
