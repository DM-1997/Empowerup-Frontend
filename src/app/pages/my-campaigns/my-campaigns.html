<div class="page"> 

  <div class="header">
    <h1>Minhas Campanhas</h1>
    <p>Gerencie todas as suas campanhas criadas</p>
  </div>

  <div class="cards">

    <div class="card" *ngFor="let campanha of campanhas">

      <img [src]="campanha.imagem" />

      <div class="content">
        <h3>{{ campanha.titulo }}</h3>
        <p>{{ campanha.descricao }}</p>

        <div class="progress">
          <div
            class="bar"
            [style.width.%]="(campanha.arrecadado / campanha.meta) * 100">
          </div>
        </div>

        <span>
          Kz {{ campanha.arrecadado }} de Kz {{ campanha.meta }}
        </span>

        <div class="actions">
          <button class="edit" (click)="editar(campanha.id)">
            Editar
          </button>

          <button class="delete" (click)="eliminar(campanha.id)">
            Eliminar
          </button>
        </div>
      </div>

    </div>

  </div>

</div>
