<div class="d-flex min-vh-100 bg-light">

  <!-- SIDEBAR -->
  <aside class="bg-primary text-white p-4 d-flex flex-column" style="width: 260px;">

    <!-- LOGO -->
    <div class="text-center mb-5">
      <h3 class="mb-0">EmpowerUp</h3>
      <small class="text-white-50">Doador</small>
    </div>

    <!-- MENU -->
    <nav class="nav flex-column gap-2">

      <a class="nav-link text-white rounded px-3 py-2"
   routerLink="/supporter"
   routerLinkActive="text-warning fw-bold ps-4"
   [routerLinkActiveOptions]="{ exact: true }">
  <span class="me-2">➤</span> Dashboard
</a>

<a class="nav-link text-white rounded px-3 py-2"
   routerLink="/supporter/campaigns"
   routerLinkActive="text-warning fw-bold ps-4">
  <span class="me-2">➤</span> Campanhas
</a>

<a class="nav-link text-white rounded px-3 py-2"
   routerLink="/supporter/contributions"
   routerLinkActive="text-warning fw-bold ps-4">
  <span class="me-2">➤</span> Contribuições
</a>

<a class="nav-link text-white rounded px-3 py-2"
   routerLink="/supporter/profile"
   routerLinkActive="text-warning fw-bold ps-4">
  <span class="me-2">➤</span> Perfil
</a>

    </nav>

  </aside>

  <!-- CONTENT -->
  <div class="flex-grow-1">

    <!-- HEADER -->
    <header class="bg-white shadow-sm px-4 py-3 d-flex justify-content-between align-items-center">

      <h4 class="mb-0 fw-bold text-dark">Painel do Doador</h4>

      <div class="badge bg-primary px-3 py-2">
        👤 {{ nome }}
      </div>

    </header>

    <!-- MAIN -->
    <main class="p-4">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
