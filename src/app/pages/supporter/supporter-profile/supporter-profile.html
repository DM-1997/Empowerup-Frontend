<div class="container py-5">

  <!-- HERO -->
  <div class="row align-items-center bg-primary text-white rounded-4 p-5 mb-5 shadow-sm">

    <div class="col-lg-8">

      <span class="badge bg-light text-primary px-3 py-2 mb-3">
        👤 Perfil do Apoiador
      </span>

      <h1 class="fw-bold display-5">
        Minha Conta
      </h1>

      <p class="lead mt-3">
        Mantenha os seus dados pessoais atualizados para uma melhor experiência na plataforma EmpowerUp.
      </p>

    </div>

    <div class="col-lg-4 text-center mt-4 mt-lg-0">

      <div class="display-1">
        👤
      </div>

    </div>

  </div>

  <!-- CARD PERFIL -->
  <div class="card border-0 shadow-sm rounded-4 p-4">

    <!-- ALERTA -->
    <div *ngIf="mensagem" class="alert alert-success text-center fw-semibold">
      ✔ {{ mensagem }}
    </div>

    <!-- FOTO -->
    <div class="text-center mb-4">

      <img
        [src]="utilizador.foto"
        class="rounded-circle shadow"
        style="width:150px;height:150px;object-fit:cover;border:4px solid #fff;"
        alt="Foto do utilizador">

      <h3 class="mt-3 fw-bold">
        {{ utilizador.nome }}
      </h3>

      <small class="text-muted">
        Apoiador EmpowerUp
      </small>

    </div>

    <!-- FORM -->
    <div class="row g-3">

      <div class="col-md-6">

        <label class="form-label fw-semibold">👤 Nome</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="utilizador.nome">

      </div>

      <div class="col-md-6">

        <label class="form-label fw-semibold">📧 Email</label>

        <input
          type="email"
          class="form-control"
          [(ngModel)]="utilizador.email">

      </div>

      <div class="col-md-6">

        <label class="form-label fw-semibold">📱 Telefone</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="utilizador.telefone">

      </div>

      <div class="col-md-6">

        <label class="form-label fw-semibold">📍 Endereço</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="utilizador.endereco">

      </div>

    </div>

    <!-- BOTÃO -->
    <div class="d-flex justify-content-end mt-4">

      <button
        class="btn btn-primary px-4 py-2 fw-semibold rounded-3"
        (click)="guardar()">

        💾 Guardar Alterações

      </button>

    </div>

  </div>

</div>
