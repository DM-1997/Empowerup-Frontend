<div class="campaign-container">

  <div class="header">
    <h1>Criar Campanha</h1>
    <p>Partilhe a sua ideia e comece a angariar apoio</p>
  </div>

  <form (ngSubmit)="criarCampanha()" class="campaign-form">

    <!-- TÍTULO -->
    <div class="form-group">
      <label>Título da Campanha</label>
      <input
        type="text"
        [(ngModel)]="campanha.titulo"
        name="titulo"
        required
      />
    </div>

    <!-- DESCRIÇÃO -->
    <div class="form-group">
      <label>Descrição</label>
      <textarea
        rows="5"
        [(ngModel)]="campanha.descricao"
        name="descricao"
      ></textarea>
    </div>

    <!-- META -->
    <div class="form-group">
      <label>Meta (Kz)</label>
      <input
        type="number"
        [(ngModel)]="campanha.valorAlvo"
        name="valorAlvo"
      />
    </div>

    <!-- 📸 IMAGEM -->
    <div class="form-group">
      <label>Imagem da campanha</label>

      <input
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)"
      />

      <small *ngIf="campanha.imageName">
        📸 Imagem selecionada: {{ campanha.imageName }}
      </small>
    </div>

    
    <!-- 🎥 VÍDEO -->
    <div class="form-group">
      <label>Vídeo da campanha</label>

      <input
        type="file"
        accept="video/*"
        (change)="onVideoSelected($event)"
      />

      <small *ngIf="campanha.videoName">
        🎥 Vídeo selecionado: {{ campanha.videoName }}
      </small>
    </div>

    <!-- BOTÃO -->
    <button type="submit" class="btn-primary">
      Criar Campanha
    </button>

  </form>

</div>
