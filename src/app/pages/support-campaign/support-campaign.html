<div class="support-container" *ngIf="campaign$ | async as campaign">

  <div class="card">

    <!-- VOLTAR -->
    <div class="top-actions">
      <button class="back-button" (click)="voltar()">
        ← Voltar
      </button>
    </div>

    <!-- IMAGEM -->
    <div class="image-wrapper">
      <img [src]="campaign.imagemUrl || 'https://picsum.photos/800/400'" />

      <div class="overlay">
        <span class="badge">Campanha ativa</span>
      </div>
    </div>

    <!-- CONTEÚDO -->
    <div class="content">

      <h1>{{ campaign.titulo }}</h1>

      <p class="description">
        {{ campaign.descricao }}
      </p>

      <!-- PROGRESS -->
      <div class="progress-section">

        <div class="progress-header">
          <span>Progresso da campanha</span>

          <span class="percent">
            {{
              campaign.valorAlvo
                ? ((campaign.valorArrecadado / campaign.valorAlvo) * 100
                  | number:'1.0-0')
                : 0
            }}%
          </span>
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            [style.width.%]="campaign.valorAlvo
              ? (campaign.valorArrecadado / campaign.valorAlvo) * 100
              : 0">
          </div>
        </div>

        <div class="values">
          <div>
            <small>Arrecadado</small>
            <strong>Kz {{ campaign.valorArrecadado }}</strong>
          </div>

          <div>
            <small>Meta</small>
            <strong>Kz {{ campaign.valorAlvo }}</strong>
          </div>
        </div>

      </div>

      <hr>

      <!-- FORM -->
      <h3 class="section-title">Contribuir agora</h3>

      <div class="form-group">
        <label>Valor (Kz)</label>
        <input type="number" [(ngModel)]="valor" placeholder="Ex: 5000">
      </div>

      <div class="form-group">
        <label>Método de pagamento</label>
        <select [(ngModel)]="paymentMethod">
          <option value="PAYPAY">PayPay</option>
          <option value="MULTICAIXA_EXPRESS">Multicaixa Express</option>
          <option value="REFERENCIA">Referência Bancária</option>
        </select>
      </div>

      <button
        class="primary-button"
        (click)="apoiar()"
        [disabled]="valor <= 0">

        Apoiar agora
      </button>

    </div>

  </div>

</div>
