<div class="admin-container">

  <!-- HEADER -->
  <div class="header">
    <h1>Painel Administrativo</h1>
    <p>Gestão da plataforma EmpowerUp</p>
  </div>

  <!-- CARDS -->
  <div class="stats-grid" *ngIf="stats$ | async as stats">

    <div class="card">
      <h2>{{ stats.totalUsers }}</h2>
      <p>Utilizadores</p>
    </div>

    <div class="card">
      <h2>{{ stats.totalCampaigns }}</h2>
      <p>Campanhas</p>
    </div>

    <div class="card">
      <h2>kz {{ stats.totalRaised | number }}</h2>
      <p>Total Arrecadado</p>
    </div>

  </div>

  <!-- LOADING STATE (opcional) -->
  <div *ngIf="!(stats$ | async)" class="text-center py-4">
    <div class="spinner-border text-primary"></div>
    <p>Carregando dados...</p>
  </div>

  <!-- AÇÕES -->
  <div class="actions">

    <a routerLink="/admin/users" class="btn">
      Gerir Utilizadores
    </a>

    <a routerLink="/admin/campaigns" class="btn dark">
      Gerir Campanhas
    </a>

  </div>

</div>
