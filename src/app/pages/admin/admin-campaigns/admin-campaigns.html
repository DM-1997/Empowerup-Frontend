<div class="campaigns-container">

  <div class="header">
    <h1>Campanhas</h1>
    <p>Gestão de campanhas da plataforma EmpowerUp</p>
  </div>

  <div class="table-wrapper">

    <table class="campaigns-table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Utilizador</th>
          <th>Progresso</th>
          <th>Estado</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let c of (campaigns$ | async)">

          <td>{{ c.id }}</td>
          <td>{{ c.titulo }}</td>
          <td>{{ c.proponente }}</td>

          <td>
            kz {{ c.valorArrecadado }} / kz {{ c.valorAlvo }}

            <div class="progress">
              <div class="bar"
                   [style.width.%]="(c.valorArrecadado / c.valorAlvo) * 100">
              </div>
            </div>
          </td>

          <td>
            <span class="badge" [ngClass]="c.estado">
              {{ c.estado }}
            </span>
          </td>

          <td class="actions">

            <!-- APROVAR -->
            <button
              class="btn-approve"
              (click)="approveCampaign(c.id)"
              *ngIf="c.estado !== 'ATIVA'">

              Aprovar
            </button>

            <!-- REMOVER -->
            <button
              class="btn-delete"
              (click)="deleteCampaign(c.id)">

              Remover
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
