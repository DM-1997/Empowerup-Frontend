<div class="users-container">

  <!-- HEADER -->
  <div class="header">
    <h1>Utilizadores</h1>
    <p>Gestão de contas da plataforma EmpowerUp</p>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">

    <table class="users-table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Tipo</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users">

          <td>{{ user.id }}</td>
          <td>{{ user.nome }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge" [ngClass]="user.tipo">
              {{ user.tipo }}
            </span>
          </td>

          <td>
            <button class="btn-delete" (click)="deleteUser(user.id)">
              Remover
            </button>
          </td>

        </tr>
      </tbody>

    </table>

  </div>

</div>
